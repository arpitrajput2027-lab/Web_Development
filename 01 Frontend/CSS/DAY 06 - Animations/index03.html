<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            margin-top: 50px;
            background-color: #111;
        }

        .container {
            width: 700px;
            height: 50px;
            overflow: hidden;
            background-color: black;
            border: 2px solid white;
        }

        .track {
            display: flex;
            width: max-content;
            animation: scroll 12s linear infinite;
        }

        .text {
            color: white;
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
            padding-right: 50px;
            height: 50px;

            display: flex;
            align-items: center;
        }

        @keyframes scroll {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="track">

            <div class="text">
                AI Engineer ~ Full Stack Developer ~ Open to Work ~ Solo Builder ~ Founder of Svedaz
            </div>

            <div class="text">
                AI Engineer ~ Full Stack Developer ~ Open to Work ~ Solo Builder ~ Founder of Svedaz
            </div>

        </div>
    </div>

</body>

</html>
