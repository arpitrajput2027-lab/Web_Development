<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Astrology App</h1>
    <div class="box" id="div_box">

        <form id="form">
            <!-- <h2>first name , surname , date , month,year,birth place</h2> -->

            <div>
                <label for="first_name">First Name :</label>
                <input type="text" id="first_name" name="first_name">
            </div>
            <div>
                <label for="Surname">Surname :</label>
                <input type="text" id="Surname" name="Surname">
            </div>
            <div>
                <label for="day">Day of Birth :</label>
                <input type="number" id="day" name="day">
            </div>
            <div>
                <label for="month">Month of Birth :</label>
                <input type="number" id="month" name="month">
            </div>
            <div>
                <label for="year">Year of Birth :</label>
                <input type="   number" id="year" name="year">
            </div>
            <div>
                <label for="place">Birth Place :</label>
                <input type="text" id="place" name="place">
            </div>

            <button type="submit" id="btn">Submit</button>

        </form>
        <h2 id="prediction">Your Astrological Prediction will Show here..</h2>

    </div>

</body>
<script src="script.js"></script>

</html>
