<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator</title>
</head>

<body style="background-color: black; color: white; display: flex; justify-content: center;flex-direction: column; align-items: center; height: 100vh;">
    <div><h1>💘Love Calculator 💝</h1></div>
    <form id="form" style="display: flex; flex-direction: column; gap: 10px;">
        
        <div>
            <label for="Boy">Boy</label>
            <input type="text" id="Boy" name="Boy" required>
        </div>

        <div>
            <label for="Girl">Girl</label>
            <input type="text" id="Girl" name="Girl" required>
        </div>

        <div>
            <button style="margin-left: 70px;" type="submit">Submit</button>
        </div>
        
    </form>
    <h2 id="result" >Result : </h2>

</body>
<script src="script.js"></script>

</html>
